import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
    id 'scala'

}


ext {
    scalaMajorVersion = '3.3'
    scalaVersion = "${scalaMajorVersion}.8"
}


repositories {
    flatDir {
        dirs 'lib'
    }

    mavenCentral()
}

sourceSets.main.scala.srcDirs = ['src']
sourceSets.test.scala.srcDirs = ['test']


dependencies {
    // scalaRepl("org.scala-lang:scala3-library_3:${scalaVersion}")
    implementation("org.scala-lang:scala3-compiler_3:${scalaVersion}")
    implementation("org.scala-lang:scala3-library_3:${scalaVersion}")
    testImplementation 'junit:junit:4.13.2'
    testImplementation('org.junit.vintage:junit-vintage-engine:5.9.0')
    
    testImplementation("org.scalatest:scalatest_3:3.2.19")
    testImplementation("org.scalatestplus:junit-4-13_3:3.2.19.0")
}


task zip(type: Zip) {
    group = "prepareZipForSubmit"
    description = "Zip your code for submission to Canvas"

    // To make sure you can always run this task
    outputs.upToDateWhen { false }
    dependsOn assemble
    from fileTree(dir: '.')
    include 'src/warmup/**.scala'

    archiveFileName = 'warmup.zip'
    destinationDirectory = layout.buildDirectory.dir("$projectDir")
}


/* this prints a number between 0.0 and 1.0 to stderr
   for use in codegrade
 */
task fraction(type: JavaExec, dependsOn: classes) {
    // To make sure you can always run this task
    outputs.upToDateWhen { false }
    mainClass = 'warmup.infrastructure.ReportFraction'
    classpath sourceSets.test.runtimeClasspath
    classpath sourceSets.main.runtimeClasspath
}

task scalaRepl(type: JavaExec, dependsOn: classes) {
    group = "scala"
    mainClass = "dotty.tools.MainGenericRunner"
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in

    args("-usejavacp")
}
